name: Bug report
description: Report a reproducible problem in OpenVision
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve OpenVision. Do not attach private visual recordings.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps and non-sensitive sample data if possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, device, browser, and OpenVision revision.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
